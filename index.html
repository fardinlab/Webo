<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me on WhatsApp</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-box {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
            max-width: 350px;
            width: 85%;
        }

        h2 {
            color: #222;
            font-size: 23px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.35);
            transition: all 0.3s ease;
        }

        .whatsapp-link:hover {
            background: linear-gradient(135deg, #128C7E, #075E54);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(18, 140, 126, 0.35);
        }

        .whatsapp-link:active {
            transform: scale(0.96);
        }

        .whatsapp-icon {
            width: 23px;
            height: 23px;
            fill: currentColor;
        }

        .number {
            color: #555;
            font-size: 15px;
            margin-top: 22px;
        }
    </style>
</head>
